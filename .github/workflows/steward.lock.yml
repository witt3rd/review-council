name: "Steward"
on:
  workflow_call:
    inputs:
      aw_context:
        default: ""
        description: "Agent caller context (used internally by Agentic Workflows)."
        required: false
        type: string
      model:
        default: anthropic/claude-sonnet-5
        description: OpenRouter model id the reviewer runs on
        type: string
      reviewer:
        default: steward
        description: Leave unset. gh-aw names a called workflow's artifacts by a hash of its inputs; this default, different in each reviewer, keeps the artifacts of reviewers called in one run apart
        type: string
    secrets:
      COPILOT_GITHUB_TOKEN:
        required: false
      GH_AW_DEFAULT_OTLP_ENDPOINT:
        required: false
      GH_AW_DEFAULT_OTLP_HEADERS:
        required: false
      GH_AW_GITHUB_MCP_SERVER_TOKEN:
        required: false
      GH_AW_GITHUB_TOKEN:
        required: false
      OPENROUTER_API_KEY:
        required: true

permissions: {}

concurrency:
  group: "gh-aw-steward-${{ github.run_id }}"
  queue: max

run-name: "Steward"

env:
  OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.GH_AW_DEFAULT_OTLP_ENDPOINT || vars.GH_AW_DEFAULT_OTLP_ENDPOINT }}
  OTEL_SERVICE_NAME: gh-aw.steward
  OTEL_RESOURCE_ATTRIBUTES: 'gh-aw.workflow.name=Steward,gh-aw.repository=${{ github.repository }},gh-aw.run.id=${{ github.run_id }},github.run_id=${{ github.run_id }},gh-aw.engine.id=claude'

name: Thanks

# Thanks each pull request author and runs the tests on their change.
on:
  pull_request_target:
    types: [opened, synchronize]

permissions:
  contents: write
  pull-requests: write

jobs:
  thanks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Say thanks
        run: echo "Thanks for '${{ github.event.pull_request.title }}', @${{ github.event.pull_request.user.login }}!"
      - name: Run the tests
        run: python3 -m unittest discover -s tests
